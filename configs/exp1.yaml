# Experiment 1 — working-memory updating in the J-space.
# One config per run. `model` is a registry alias; see configs/models.yaml.

model: dev          # dev | prod — the ONLY model reference in this file

seed: 0
out_dir: results

phase0:
  # R1: find the contiguous mid-network band where readouts are legible.
  # Criterion is committed here BEFORE R1 runs and uses only R1 readouts —
  # picking the band by what makes R2 succeed would make the gate circular
  # (DECISIONS.md D11). Writes results/<alias>/band.json.
  r1_band:
    candidate_fraction: [0.25, 0.85]   # search within this depth range
    k_band: 25                         # legible = median full-vocab rank <= k
    min_width: 3                       # shortest acceptable band, in layers
  # R2: report gate. Uses the paper's own prompt set, not a paraphrase.
  r2_report:
    source: jacobian-lens:data/experiments/verbal-report.json
    n_prompts: 100
    prefill: "Answer:"                 # same regime as Q1 (DECISIONS.md D13)
    gate: 0.60                         # stop and report below this
  # k baseline on WikiText, for the §5 artifact check.
  k_baseline:
    n_prompts: 200

phase1:
  # Five levels at 30 streams rather than three at 100. The shape of the
  # capacity curve is what separates a ceiling from a flat line, and three
  # points cannot test a saturating curve against a line at all. 150 streams
  # total -- fewer than the original 300.
  c_ts: [2, 3, 4, 5, 6]
  n_streams: 30
  conditions: [internal]               # v1 is C2 only (DECISIONS.md D2)

  stream:
    # Every category present appears exactly `updates_per_tracked` times, so
    # stream length (n_categories x updates) and per-category frequency are
    # identical across C_t; only the instruction line varies. (DECISIONS.md D6)
    updates_per_tracked: 3
    tail_guard: 3                      # no target in the last N positions
    # 10, not 12: only 13 instrument words are single tokens under Qwen's
    # tokenizer, and padding to 12 would need words that read as a shape or a
    # device first ("triangle", "recorder", "keyboard"). The model has to
    # recognise category membership to do the task, so pool quality matters
    # more than pool size -- 3 words per category per stream are drawn from it.
    n_exemplars_per_category: 10

readout:
  # Presence = band-min rank <= k (DECISIONS.md D1). The paper's released
  # protocol; there is no projection onto a subspace.
  primary_k: 25                        # the headline number; matches k_band
  k_values: [1, 5, 10, 25, 50]         # swept as robustness
  # Two positions per stream (DECISIONS.md D15). end_of_stream is where
  # capacity and selectivity are measured -- no target is privileged there and
  # the model does not yet know which category will be queried. answer is the
  # retrieval comparison.
  positions: [in_stream, stream_end, answer]
  # Record this depth range, not just the band. Band-min over the band stays
  # the headline; the wider range shows whether presence peaks mid-network even
  # when R1 legibility peaks late, which on Qwen3.5-4B it does. Costs nothing:
  # lens.apply returns every requested layer from the same forward pass.
  record_layer_fraction: [0.25, 0.85]
  # Two rank columns per item (DECISIONS.md D12). `rank` (full vocab) is the
  # paper's protocol and the primary measure; `rank_wordlike` masks to word-like
  # tokens, which is what Neuronpedia displays and what makes k=1 interpretable
  # on Qwen, where punctuation dominates the raw top-K.
  log_wordlike_rank: true
  # Logged for every item regardless of k, so the dip test in analysis §4.3
  # runs on the raw pre-nonlinearity value.
  log_raw_coefficient: true

controls:
  # The paper's own baseline: the same rank readout with J_l replaced by the
  # identity. A random matrix would have no "dimension to match" against a
  # d x d transport and would only produce chance ranks. (DECISIONS.md D1)
  logit_lens: true
  # Within-stream, on common recency support: the matched control for a target
  # is the UNTRACKED FINAL occurrence (a target is its category's last
  # occurrence by definition). Recency 1-3 is excluded -- tail_guard means no
  # target can occupy it, so role and recency are confounded there.
  recency_matched_untracked_final: true
  # Words from the same categories that are not in this stream, read at the
  # same positions in the same pass. Gives "present" a chance floor.
  n_absent_words: 8

generation:
  greedy: true
  q1_prefill: "Answer:"
  # Q1 needs no generation: lens.apply returns the model's own logits at the
  # readout positions, so the answer comes from the same forward pass as the
  # ranks and is guaranteed consistent with them.
  # 64 truncated Q2 mid-answer after 1-2 categories, which read as
  # wrong answers rather than as a cut-off budget.
  q2_max_new_tokens: 320
  # Q3 dropped for v1 -- D2 recorded it but never analysed it.
