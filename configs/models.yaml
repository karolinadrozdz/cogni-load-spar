# Model registry: the only place in this repo that names a model or a lens.
#
# Add a model: add an alias block. Use it: `--model <alias>`, or `model:` in
# configs/experiments.yaml. Every ref is a commit sha; registry.resolve()
# refuses anything else.
#
# Hand-written, never machine-rewritten: a YAML round-trip drops these comments.
# The band is discovered by find_band and lives in results/<alias>/band.json.

defaults:
  dtype: bfloat16
  lens_repo: neuronpedia/jacobian-lens
  lens_revision: 16a01f309fcec900fdcec3f4cd5b64f3d00e4d5a

aliases:

  # dev and prod share the lens repo, model family, tokenizer and chat
  # template, so a result that holds on dev and breaks on prod implicates scale.
  dev:
    hf_id: Qwen/Qwen3.5-4B
    hf_revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
    n_layers: 32
    d_model: 2560
    lens_file: qwen3.5-4b/jlens/Salesforce-wikitext/Qwen3.5-4B_jacobian_lens_n1000.pt
    # MANDATORY. The Qwen3 template's `else` branch opens `<think>\n`, so an
    # unset flag means thinking is on and the model writes its state out.
    enable_thinking: false

  prod:
    hf_id: Qwen/Qwen3.6-27B
    hf_revision: 6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
    n_layers: 64
    d_model: 5120
    lens_file: qwen3.6-27b/jlens/Salesforce-wikitext/Qwen3.6-27B_jacobian_lens_n1000.pt
    enable_thinking: false
