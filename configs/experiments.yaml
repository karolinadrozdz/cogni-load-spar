# Every experiment's settings. `model` is a registry alias (configs/models.yaml);
# override it per run with --model.
model: dev
out_dir: results

find_band:
  # Fixed before find_band runs, and judged on its readouts only, so the band
  # cannot be chosen by what makes an experiment come out well.
  candidate_fraction: [0.25, 0.85]   # search this depth range
  k_band: 25                         # legible = median full-vocab rank <= k
  min_width: 3                       # shortest acceptable band, in layers

readout:
  primary_k: 25                      # present = band-min rank <= k
  # Recorded around the band, to show whether presence peaks outside it.
  record_layer_fraction: [0.25, 0.85]

confidence:
  sets:                              # run one with --set; each written by the script beside it
    capitals: stimuli/capitals.csv   # 50 real and 50 invented countries
    regions: stimuli/regions.csv     # 130 real regions, from famous to little known
  top_k: 25                          # top word-like tokens kept per layer
  max_new_tokens: 8                  # enough to tell a named capital from a refusal
  # A second window, before the answer is readable: on dev the queried word of
  # the keep-track runs is absent through L18 of 32. Fixed before the full run.
  early_fraction: [0.25, 0.60]
