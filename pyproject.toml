[project]
name = "cogniload"
version = "0.1.0"
description = "SPAR Experiment 1 — working-memory updating in the J-space"
requires-python = ">=3.11"
# Core: enough to generate stimuli, read results, and run the tests. Everything
# needed to *load a model* is in the `gpu` extra, so a laptop does not pull it.
dependencies = [
    "torch>=2.5",
    "pyyaml>=6",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "scipy>=1.14",
]

[project.optional-dependencies]
# On the GPU. jlens is pinned for the same reason the model registry refuses
# unpinned refs: it is an unmaintained reference implementation, so `main`
# moving would change the readout without changing our code.
gpu = [
    "jlens @ git+https://github.com/anthropics/jacobian-lens@581d398613e5602a5af361e1c34d3a92ea82ba8e",
    # jlens itself requires >=5.5, and the Qwen3.5/3.6 model cards need current
    # transformers. A lower floor resolves but fails at load time.
    "transformers>=5.5",
    "accelerate",  # device_map="auto"
]
# On a laptop: launch Modal runs, run the tests, inspect downloaded parquet.
local = ["modal>=1.0", "pytest>=8", "ruff>=0.6", "jinja2>=3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 90

[tool.pytest.ini_options]
testpaths = ["tests"]
# Stimulus, registry and prompt tests are pure, so they run without the GPU
# dependency stack installed.
pythonpath = ["src"]
